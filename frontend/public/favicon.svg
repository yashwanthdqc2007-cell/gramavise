<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gv_emerald_grad" x1="4" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27C7D9" />
      <stop offset="45%" stop-color="#19D98B" />
      <stop offset="100%" stop-color="#0E9F6E" />
    </linearGradient>
    <linearGradient id="gv_accent_glow" x1="10" y1="6" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27C7D9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#19D98B" stop-opacity="0.3" />
    </linearGradient>
    <filter id="gv_subtle_shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#19D98B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Hexagonal Community Foundation (Subtle Dark Grounding) -->
  <path d="M18 3L31 10.5V25.5L18 33L5 25.5V10.5L18 3Z" 
        fill="#0B2332" 
        stroke="url(#gv_emerald_grad)" 
        stroke-width="1.75" 
        stroke-linejoin="round" />

  <!-- Inner Geometric "G" Arch & Network Pathways -->
  <path d="M12 14.5C12 11.5 14.5 9 18 9C21 9 23.5 10.8 24.5 13.5" 
        stroke="#27C7D9" 
        stroke-width="2" 
        stroke-linecap="round" />

  <!-- Dynamic Ascending "V" Decision Vector (Growth & Verification) -->
  <path d="M11 19.5L16.5 25L25.5 12" 
        stroke="#19D98B" 
        stroke-width="2.75" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#gv_subtle_shadow)" />

  <!-- Intelligence Apex Node -->
  <circle cx="25.5" cy="12" r="2.25" fill="#27C7D9" />
  <circle cx="25.5" cy="12" r="1" fill="#FFFFFF" />
  <circle cx="11" cy="19.5" r="1.5" fill="#19D98B" />
</svg>